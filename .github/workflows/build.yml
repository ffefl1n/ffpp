name: Build iOS IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Download Libbox Framework
        run: |
          mkdir -p Frameworks
          echo "Downloading Libbox.xcframework 1.11.11..."
          curl -sL "https://github.com/EbrahimTahernejad/sing-box-lib/releases/download/1.11.11/Libbox.xcframework.zip" -o /tmp/Libbox.zip
          unzip -q /tmp/Libbox.zip -d Frameworks/
          ls -la Frameworks/Libbox.xcframework

      - name: Generate App Icon
        run: |
          python3 scripts/generate_icon.py

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application and Extension
        run: |
          xcodebuild clean build \
            -project ffpp.xcodeproj \
            -scheme ffpp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="./derived_data/Build/Products/Release-iphoneos/ffpp.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: ffpp.app not found at $APP_PATH"
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          
          echo "Checking for embedded tunnel extension..."
          if [ -d "Payload/ffpp.app/PlugIns/ffppTunnel.appex" ]; then
            echo "✓ ffppTunnel.appex found in PlugIns!"
          else
            echo "Warning: ffppTunnel.appex not found in PlugIns. Looking in build folder..."
            EXT_PATH="./derived_data/Build/Products/Release-iphoneos/ffppTunnel.appex"
            if [ -d "$EXT_PATH" ]; then
              mkdir -p Payload/ffpp.app/PlugIns
              cp -R "$EXT_PATH" Payload/ffpp.app/PlugIns/
              echo "✓ Copied ffppTunnel.appex into Payload/ffpp.app/PlugIns"
            fi
          fi
          
          zip -qr9 ffpp-unsigned.ipa Payload
          shasum -a 256 ffpp-unsigned.ipa > ffpp-unsigned.ipa.sha256
          echo "SHA256: $(cat ffpp-unsigned.ipa.sha256)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffpp-unsigned-ipa
          path: |
            ffpp-unsigned.ipa
            ffpp-unsigned.ipa.sha256
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.1"
          name: "ffpp v1.0.1"
          body: |
            ## ffpp v1.0.1 — iOS VLESS / Hysteria Client
            
            ### Что нового в v1.0.1:
            - **Встроенное ядро sing-box (Libbox 1.11.11)**: Реальная обработка сетевого трафика внутри NetworkExtension (`utun`).
            - **Исправлен сброс на "нолики"**: Трафик больше не блокируется; системный поток пакетов направляется в ядро sing-box и проксируется по VLESS / Hysteria.
            - **Надежный DNS**: Поддержка внутреннего резолвера (`dns-out`), обход локальных сетей (Bypass LAN), отсутствие утечек.
            - **Стильная иконка приложения**: Темный премиальный стиль со светящейся молнией.
            - **Полноэкранный режим**: Устранены черные рамки/полосы через родной `LaunchScreen.storyboard`.
            - **Мгновенное обновление Dashboard**: Статус подключения реагирует в реальном времени.
            - **GeoIP локация серверов**: Автоматическое определение страны и эмодзи-флага по IP-адресу ноды.
            - **Идеальная совместимость с Happ**: Постоянный Keychain HWID и правильная эмуляция клиента с динамическим определением iPhone.
            
            ### Инструкция по установке:
            1. Скачайте `ffpp-unsigned.ipa` ниже.
            2. Откройте в GBox (или Scarlet / TrollStore / AltStore / Esign).
            3. При подписании обязательно включите тумблер:
               👉 **«Подписывать расширения / PlugIns» (Sign Extensions)**
            4. Установите и разрешите добавление VPN конфигурации в iOS.
          files: |
            ffpp-unsigned.ipa
            ffpp-unsigned.ipa.sha256
