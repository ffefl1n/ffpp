name: Build iOS IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Download Libbox Framework
        run: |
          mkdir -p Frameworks
          echo "Downloading Libbox.xcframework 1.11.11..."
          curl -sL "https://github.com/EbrahimTahernejad/sing-box-lib/releases/download/1.11.11/Libbox.xcframework.zip" -o /tmp/Libbox.zip
          unzip -q /tmp/Libbox.zip -d Frameworks/
          ls -la Frameworks/Libbox.xcframework

      - name: Generate App Icon
        run: |
          python3 scripts/generate_icon.py

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application and Extension
        run: |
          xcodebuild clean build \
            -project ffpp.xcodeproj \
            -scheme ffpp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH="./derived_data/Build/Products/Release-iphoneos/ffpp.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: ffpp.app not found at $APP_PATH"
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          
          echo "Checking for embedded tunnel extension..."
          if [ -d "Payload/ffpp.app/PlugIns/ffppTunnel.appex" ]; then
            echo "✓ ffppTunnel.appex found in PlugIns!"
          else
            echo "Warning: ffppTunnel.appex not found in PlugIns. Looking in build folder..."
            EXT_PATH="./derived_data/Build/Products/Release-iphoneos/ffppTunnel.appex"
            if [ -d "$EXT_PATH" ]; then
              mkdir -p Payload/ffpp.app/PlugIns
              cp -R "$EXT_PATH" Payload/ffpp.app/PlugIns/
              echo "✓ Copied ffppTunnel.appex into Payload/ffpp.app/PlugIns"
            fi
          fi
          
          zip -qr9 ffpp-unsigned.ipa Payload
          shasum -a 256 ffpp-unsigned.ipa > ffpp-unsigned.ipa.sha256
          echo "SHA256: $(cat ffpp-unsigned.ipa.sha256)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffpp-unsigned-ipa
          path: |
            ffpp-unsigned.ipa
            ffpp-unsigned.ipa.sha256
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.2"
          name: "ffpp v1.0.2"
          body: |
            ## ffpp v1.0.2 — iOS VLESS / Hysteria Client
            
            ### Что нового в v1.0.2:
            - **Исправлен сбой запуска туннеля (Start Tunnel Crash/Deadlock Fix)**: Инициализация ядра перенесена в асинхронный воркер, устранен дедлок `DispatchSemaphore` на очереди провайдера NetworkExtension.
            - **Совместимость с DNS sing-box 1.11+**: Переход на типизированные DNS-серверы (`type: udp`, `server`, `server_port`), устранена ошибка парсинга устаревших legacy DNS форматов.
            - **Безопасное получение TUN дескриптора**: Использование прямого сканера `LibboxGetTunnelFileDescriptor()`, устранены KVC-краши `NSUnknownKeyException`.
            - **Ограничение памяти (Jetsam)**: Включен `LibboxSetMemoryLimit(true)` для защиты от завершения процесса системой iOS.
            - **Настраиваемый MTU 1500**: По умолчанию установлен 1500 с возможностью изменения и пресетами в Настройках.
          files: |
            ffpp-unsigned.ipa
            ffpp-unsigned.ipa.sha256
